<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanta Virüsü Analiz Paneli - Giriş</title>
    <style>
        /* Ekranın Tamamını Kaplayan Sihirli Esnek Düzen (Flexbox) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Static klasöründeki arka plan resmini çağırıyoruz */
            background-image: url('/static/arka-plan.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Bilgisayarda ve Telefonda Ortalı Duran Şık Cam Kart */
        .login-container {
            background: rgba(255, 255, 255, 0.85); /* Beyaz ama arkasını gösterir */
            backdrop-filter: blur(10px); /* Arkadaki resmi şıkça bulanıklaştırır */
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px; /* Bilgisayarda devasa olmasını engeller */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .login-container h2 {
            color: #1a365d;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .login-container p {
            color: #4a5568;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Giriş Alanları (Kutular) */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #2d3748;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        /* Giriş Yap Butonu */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #2b6cb0;
        }

        /* Alt Bilgi */
        .footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #718096;
        }
    </style>
</head>
<body>

    <!-- Ekranın Tam Ortasındaki Giriş Kutusu -->
    <div class="login-container">
        <h2>Hanta Virüsü Sistemi</h2>
        <p>Devam etmek için lütfen giriş yapın</p>
        
        <!-- app.py içindeki /login rotasına verileri gönderen form -->
        <form action="/login" method="POST">
            <div class="input-group">
                <label for="email">E-mail Adresiniz</label>
                <input type="email" id="email" name="email" placeholder="ornek@universite.edu.tr" required>
            </div>
            
            <div class="input-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="login-btn">Güvenli Giriş Yap</button>
        </form>
        
        <div class="footer-text">
            Hanta Virüsü Veri Analizi & Teşhis Projesi © 2026
        </div>
    </div>

</body>
</html>
